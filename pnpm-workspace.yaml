packages:
  - apps/*
  - packages/*
  - tooling/*

catalogs:
  react:
    react: 19.1.1
    react-dom: 19.1.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    next-themes: ^0.4.6

  chrome:
    '@crxjs/vite-plugin': ^2.7.1
    '@pixpilot/chrome-messenger': ^0.6.2
    '@types/chrome': ^0.3.7

  validation:
    zod: 4.6.7

  testing:
    '@testing-library/dom': ^10.4.2
    '@testing-library/jest-dom': ^6.9.1
    '@testing-library/react': ^16.3.3
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/ui': ^3.2.7
    jsdom: ^26.1.0
    vitest: ^3.2.7

  styling:
    '@tailwindcss/vite': ^4.3.3
    autoprefixer: ^10.6.2
    clsx: ^2.1.1
    postcss: ^8.5.32
    tailwind-merge: ^3.7.0
    tailwindcss: 4.3.3

  build:
    '@babel/core': ^7.29.7
    '@pixpilot/vite-plugin-source-inspector': ^0.3.1
    '@vitejs/plugin-react': ^5.2.0
    gulp: ^5.0.1
    gulp-zip: ^6.1.0
    tsx: ^4.23.15
    turbo: ^2.11.10
    vite: ^7.3.7

  typescript:
    '@types/node': ^22.20.5
    typescript: ^5.9.3

  lint:
    '@pixpilot/eslint-config': ^3.1.0
    '@pixpilot/eslint-config-next': ^1.0.1
    '@pixpilot/eslint-config-react': ^0.10.2
    eslint: ^9.37.0
    eslint-plugin-jest: ^29.17.0
    eslint-plugin-turbo: ^2.11.10

  format:
    prettier: ^3.9.10
    prettier-plugin-tailwindcss: ^0.6.14

  git:
    '@changesets/cli': ^2.31.1
    '@commitlint/cli': ^20.5.3
    '@commitlint/config-conventional': ^20.5.3
    husky: ^9.1.7
    lint-staged: ^16.4.0

  config:
    '@pixpilot/dev-config': ^3.22.1

overrides:
  '@types/node': catalog:typescript
  typescript: catalog:typescript
